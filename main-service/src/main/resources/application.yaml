server:
  port: 8080
client:
  url: http://localhost:8080
spring:
  output:
    ansi:
      enabled: always
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://ewm-db:5432/main
    username: main
    password: main
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true