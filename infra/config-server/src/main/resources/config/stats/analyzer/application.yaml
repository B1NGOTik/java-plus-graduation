spring:
  application:
    name: analyzer

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=stats_analyzer
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: stats_analyzer
        hbm2ddl:
          create_namespaces: true
  sql:
    init:
      mode: never

kafka:
  bootstrap:
    servers: localhost:9092
  consumer:
    group:
      action: stats.analyzer.action
      similarity: stats.analyzer.similarity
    poll:
      timeout: 100
  topics:
    stats-user-action-v1: stats.user-actions.v1
    stats-events-similarity-v1: stats.events-similarity.v1

server:
  port: 9191

grpc:
  server:
    port: 9192

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true