server:
  port: 0
spring:
  cloud:
    gateway:
      discovery.locator.enabled: true
      routes:
        - id: main_service_route
          uri: lb://main-service

          predicates:
            - Path=/main-service/**
          filters:
            - PrefixPath=/api/v1

        - id: stats_service_route
          uri: lb://stats-service

          predicates:
            - Path=/stats-service/**
          filters:
            - PrefixPath=/api/v1

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/