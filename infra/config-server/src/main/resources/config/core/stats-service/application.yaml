server:
  port: 0
client:
  url: http://localhost:9090
spring:
  application:
    name:
      stats-service
  output:
    ansi:
      enabled: always
  sql:
    init:
      mode: always
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/stat
    username: stat
    password: stat
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/