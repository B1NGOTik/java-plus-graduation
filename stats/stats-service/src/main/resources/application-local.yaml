server:
  port: 0

client:
  url: http://localhost:9090

spring:
  application:
    name:
      stats-service
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:stats
    username: main
    password: main
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/